[project]
name = "flask-serial"
version = "0.1.0"
description = "ESP32-Flask serial communication interface for CSI data"
dependencies = [
    "pyserial>=3.5",
    "numpy>=1.24",
    "scipy>=1.10",
    "csiread>=1.4",
    "CSIKit>=2.5",
]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
